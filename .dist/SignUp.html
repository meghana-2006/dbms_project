<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriTech Sign-Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url(login-image1.jpg);
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .signup-container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      width: 400px;
      animation: fadeInScale 0.7s ease;
    }

    h2 {
      color: #007a4d;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .btn-signup {
      display: inline-block;
      width: 100%;
      padding: 10px;
      background-color: #007a4d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-top: 10px;
    }

    .btn-signup:hover {
      background-color: #457b9d;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
    }

    .login-link a {
      color: #007a4d;
      font-weight: 600;
      text-decoration: none;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Success Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .checkmark {
      width: 80px;
      height: 80px;
      background: #007a4d;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: popIn 0.5s ease;
    }

    .checkmark svg {
      width: 40px;
      height: 40px;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: drawCheck 0.6s 0.5s ease forwards;
    }

    .overlay h3 {
      color: #007a4d;
      font-size: 22px;
      animation: fadeText 1s ease forwards;
    }

    @keyframes popIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fadeText {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="signup-container">
    <h2>Create an Account</h2>
    <form id="signup-form" onsubmit="event.preventDefault(); signup();">
      <div class="form-group">
        <label for="role">Select Role</label>
        <select id="role" required>
          <option value="">-- Choose --</option>
          <option value="farmer">Farmer</option>
          <option value="retailer">Retailer</option>
        </select>
      </div>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required />
      </div>

      <button class="btn-signup" type="submit">Sign Up</button>
    </form>

    <p class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </p>
  </div>

  <!-- Success Overlay -->
  <div class="overlay" id="successOverlay">
    <div class="checkmark">
      <svg viewBox="0 0 52 52">
        <path d="M14 27l7 7 17-17" />
      </svg>
    </div>
    <h3>Signup Successful!</h3>
  </div>

  <script>
    function signup() {
      const role = document.getElementById("role").value;
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (!role || !name || !email || !username || !password || !confirmPassword) {
        alert("Please fill all fields.");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      // Show animated success overlay
      document.getElementById("successOverlay").classList.add("active");

      // Redirect based on role
      setTimeout(() => {
        if (role === "farmer") {
          window.location.href = "home.html";
        } else if (role === "retailer") {
          window.location.href = "home.html";
        }
      }, 2500); // 2.5 seconds delay
    }
    localStorage.setItem("userRole", role); // Already exists in your login function
    if (role === "farmer") {
      window.location.href = "farmer-dashboard.html";
    } else if (role === "retailer") {
      window.location.href = "retailer-dashboard.html";
    }
  </script>

</body>
</html>
