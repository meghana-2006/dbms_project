<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmManure - Buy Manures Online</title>
  <link rel="stylesheet" href="manure.css">
</head>
<body>

<header>
  <h1>🌾 FarmManure - Organic & Non-Organic Manures</h1>
  <p>High-quality manures for better farming!</p>
  <button id="viewCartBtn">🛒 View Cart (<span id="cartCount">0</span>)</button>
</header>

<section class="manure-section">
  <h2>Available Manures</h2>
  <div class="manure-container" id="manureList">
    <!-- Manures will be loaded dynamically here -->
  </div>
</section>

<!-- Cart Section -->
<section class="cart-section" id="cartSection" style="display:none;">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <h3>Total Amount: ₹<span id="cartTotal">0</span></h3>
  <button id="placeOrderBtn">✅ Place Order</button>
  <button id="closeCartBtn">❌ Close Cart</button>
</section>

<script src="mnaure.js"></script>

</body>
</html>
