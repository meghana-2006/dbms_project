<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disease Report Submission</title>
  <link rel="stylesheet" href="disease.css" />
</head>
<body>
  <div class="form-container">
    <h2>Disease Report</h2>
    <form id="diseaseForm" enctype="multipart/form-data">
      <label for="cropname">Crop Name:</label>
      <input type="text" id="cropname" name="cropname" required />

      <label for="symptom">Symptom:</label>
      <input type="text" id="symptom" name="symptom" required />

      <label for="location">Location:</label>
      <input type="text" id="location" name="location" required />

      <label for="season">Season:</label>
      <select id="season" name="season" required>
        <option value="">– Select –</option>
        <option value="kharif">Kharif</option>
        <option value="rabi">Rabi</option>
        <option value="summer">Summer</option>
        <option value="monsoon">Monsoon</option>
      </select>

      <label for="temperature">Temperature (°C):</label>
      <input type="number" id="temperature" name="temperature" required />

      <label for="humidity">Humidity (%):</label>
      <input type="number" id="humidity" name="humidity" required />

      <!-- <label for="symptom_image">Symptom Image:</label>
      <input type="file" id="symptom_image" name="symptom_image" accept="image/*" required /> -->

      <button type="submit">Submit Report</button>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script src="disease.js"></script>
</body>
</html>
