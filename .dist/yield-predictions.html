<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Yield Prediction</title>
    <link rel="stylesheet" href="yeild.css">
</head>
<body>
    <nav class="navbar">
        <h1>E-Krishi Yield Prediction</h1>
    </nav>

    <div class="container">
        <h2>Predict Crop Yield</h2>
        <form id="prediction-form">
            <label for="cropType">Crop Type:</label>
            <input type="text" id="cropType" name="cropType" required><br>

            <label for="soilType">Soil Type:</label>
            <input type="text" id="soilType" name="soilType" required><br>

            <label for="rainfall">Rainfall (mm):</label>
            <input type="number" id="rainfall" name="rainfall" required><br>

            <label for="temperature">Temperature (°C):</label>
            <input type="number" id="temperature" name="temperature" required><br>
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" required><br>

            <button type="submit">Predict Yield</button>
        </form>

        <div id="result" class="result-box"></div>
    </div>

    <script src="yeild.js"></script>
</body>
</html>
